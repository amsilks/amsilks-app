<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AM Silks Manager V22</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f1f5f9; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .input-field { border: 1px solid #cbd5e1; padding: 10px; rounded: 8px; width: 100%; outline: none; transition: 0.2s; font-size: 15px; background: #fff; }
        .input-field:focus { border-color: #2563eb; ring: 2px; }
        .btn { padding: 12px; rounded: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn:active { transform: scale(0.98); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50; display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3498db; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-3 md:p-6 pb-32 max-w-7xl mx-auto">

    <header class="card p-4 mb-4 flex justify-between items-center bg-white border-t-4 border-indigo-600 sticky top-0 z-40">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-indigo-900">AM SILKS TRADING</h1>
            <p class="text-xs text-gray-500">Cloud Manager V22</p>
        </div>
        <div class="flex items-center gap-2">
            <div id="syncLoader" class="loader hidden"></div>
            <button onclick="location.reload()" class="btn bg-red-100 text-red-600 text-xs border border-red-200">NEW</button>
        </div>
    </header>

    <div class="card p-4 bg-indigo-50 border-indigo-100 mb-4">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold text-indigo-800 text-sm uppercase">👤 Customer</h3>
            <span id="foundBadge" class="hidden px-2 py-0.5 bg-green-200 text-green-800 text-[10px] rounded-full font-bold">FOUND</span>
        </div>
        <div class="flex gap-2 mb-3">
            <input type="tel" id="mobileNumber" placeholder="Mobile No" class="input-field font-bold w-1/2">
            <button onclick="searchCloud()" class="btn bg-blue-600 text-white w-1/2 text-sm">SEARCH 🔍</button>
        </div>
        <input type="text" id="customerName" placeholder="Customer Name" class="input-field w-full mb-3">
        
        <div id="balanceAlert" class="hidden flex justify-between items-center bg-white p-3 rounded border border-red-200 text-red-600 font-bold text-sm">
            <span>Previous Due:</span>
            <span class="text-lg" id="prevBalDisplay">0.00</span>
        </div>
    </div>

    <div class="card p-5 mb-4">
        <h3 class="font-bold text-gray-700 text-sm uppercase mb-4 border-b pb-2">➕ Add Item</h3>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
            <select id="buildingType" class="input-field text-sm" onchange="updateRoomOptions()"><option value="House">House</option><option value="Tower">Tower</option></select>
            <input type="text" id="towerName" placeholder="Tower Name" class="input-field text-sm hidden">
            <select id="floor" class="input-field text-sm"><option>Ground</option><option>First</option><option>Mezzanine</option><option>Other</option></select>
            <select id="roomName" class="input-field text-sm"></select>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
            <select id="productCategory" class="input-field font-bold" onchange="toggleFormFields()"><option>Curtain</option><option>Blind</option></select>
            <select id="productType" class="input-field text-sm"></select>
        </div>

        <div class="flex gap-2 mb-3">
            <input type="text" id="fabricName" placeholder="Code" class="input-field font-bold w-1/2">
            <input type="text" id="catalogNo" placeholder="Cat No" class="input-field text-sm bg-yellow-50 w-1/2">
        </div>

        <div class="grid grid-cols-3 gap-2 mb-3">
            <div><label class="text-[10px] text-gray-500">Width</label><input type="number" id="width" class="input-field text-center" oninput="calculatePreview()"></div>
            <div><label class="text-[10px] text-gray-500">Height</label><input type="number" id="height" class="input-field text-center" oninput="calculatePreview()"></div>
            <div><label class="text-[10px] text-gray-500">Qty</label><input type="number" id="quantity" value="1" class="input-field text-center font-bold bg-green-50" oninput="calculatePreview()"></div>
        </div>

        <div id="curtainOptions" class="hidden bg-indigo-50 p-3 rounded mb-3 grid grid-cols-2 gap-2 border border-indigo-100">
            <div>
                <label class="text-[10px] font-bold text-indigo-800">FULLNESS</label>
                <select id="fullness" class="input-field text-sm" onchange="calculatePreview()">
                    <option value="3">1 x 3 (Normal)</option>
                    <option value="2">1 x 2 (Project)</option>
                    <option value="custom">Custom</option>
                </select>
                <input type="number" id="customRatio" placeholder="Ratio" class="input-field mt-1 hidden text-sm" oninput="calculatePreview()">
            </div>
            <div>
                <label class="text-[10px] font-bold text-indigo-800">WIDTH</label>
                <select id="fabricWidth" class="input-field text-sm" onchange="calculatePreview()">
                    <option value="140">140cm (Panel)</option>
                    <option value="280">280cm (Railroad)</option>
                    <option value="300">300cm (Railroad)</option>
                    <option value="310">310cm (Railroad)</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-3">
            <input type="number" id="pricePerUnit" placeholder="Price" class="input-field text-sm">
            <input type="number" id="stitchingCharge" placeholder="Stitch" class="input-field text-sm hidden" id="stitchingInput">
            <input type="number" id="fixingCharge" placeholder="Fixing" class="input-field text-sm">
        </div>
        <input type="text" id="itemNote" placeholder="Notes (Eyelet, etc)" class="input-field text-sm mb-3">
        <input type="text" id="itemSupplier" placeholder="Supplier" list="supplierList" class="input-field text-sm mb-3">
        <datalist id="supplierList"><option value="York"><option value="Dragon"><option value="Euro"></datalist>

        <div class="bg-gray-800 text-white p-2 rounded text-xs flex justify-between mb-3">
            <span>Estimate:</span> <span id="calcResult" class="font-mono font-bold text-yellow-400">0.00</span>
        </div>

        <button onclick="addItem()" class="btn bg-indigo-600 text-white w-full hover:bg-indigo-700 shadow-md">ADD ITEM</button>
    </div>

    <div class="card p-4 mb-20">
        <h3 class="font-bold text-xs uppercase border-b pb-2 mb-2">Order Items (<span id="cartCount">0</span>)</h3>
        <div id="cartItems" class="space-y-2 max-h-60 overflow-y-auto mb-4 text-sm text-gray-500 text-center">Empty</div>

        <div class="bg-gray-50 p-3 rounded border border-gray-200">
            <div class="flex justify-between text-sm mb-1"><span>Bill Total:</span> <span class="font-bold" id="currentBillTotal">0.00</span></div>
            <div class="flex justify-between text-sm mb-1 text-red-500"><span>Prev Balance:</span> <span id="mainPrevBal">0.00</span></div>
            <div class="grid grid-cols-2 gap-2 my-2">
                <div><label class="text-[10px]">Discount</label><input type="number" id="discountAmount" class="input-field py-1 text-right" value="0" oninput="updateTotals()"></div>
                <div><label class="text-[10px]">Advance</label><input type="number" id="advanceAmount" class="input-field py-1 text-right" value="0" oninput="updateTotals()"></div>
            </div>
            <div class="flex justify-between text-lg font-bold border-t pt-2"><span>Balance Due:</span> <span class="text-red-600" id="finalBalance">0.00</span></div>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-4">
            <button onclick="saveInvoiceTransaction()" class="btn bg-indigo-600 text-white col-span-2 shadow">SAVE & SYNC</button>
            <button onclick="openReceiptModal()" class="btn bg-green-600 text-white">RECEIPT</button>
            <button onclick="openPreview('invoice')" class="btn bg-blue-600 text-white">INVOICE</button>
            <button onclick="openPreview('po')" class="btn bg-slate-600 text-white">PO</button>
            <button onclick="openPreview('production')" class="btn bg-teal-600 text-white">WORK SHEET</button>
        </div>
    </div>

    <div id="receiptModal" class="modal">
        <div class="modal-content">
            <h3 class="text-center font-bold text-lg mb-4">Receive Payment</h3>
            <input type="number" id="receiptAmount" placeholder="Amount" class="input-field text-2xl text-center font-bold text-green-600 mb-3">
            <select id="paymentMode" class="input-field mb-3"><option>Cash</option><option>Bank Transfer</option><option>Cheque</option></select>
            <input type="date" id="paymentDate" class="input-field mb-4">
            <div class="flex gap-2">
                <button onclick="document.getElementById('receiptModal').style.display='none'" class="btn bg-gray-200 text-gray-600 flex-1">Cancel</button>
                <button onclick="saveReceipt()" class="btn bg-green-600 text-white flex-1">Save & Print</button>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = "https://script.google.com/macros/s/AKfycbxIdelVyKgSTfTgGlfi5D9KtmkQXmDv436Gegk8rqz3TDbgxXWlxtdhRsoPM6p1vVSu/exec";
        let cart = [];
        let globalRefNo = "AMS-" + Math.floor(Math.random() * 10000);

        window.onload = function() {
            toggleFormFields(); updateRoomOptions();
            document.getElementById('paymentDate').valueAsDate = new Date();
        };

        // --- 1. CLOUD SEARCH ---
        async function searchCloud() {
            const m = document.getElementById('mobileNumber').value.trim();
            if(!m) return alert("Enter Mobile Number");
            
            document.getElementById('syncLoader').classList.remove('hidden');
            try {
                const response = await fetch(`${SHEET_URL}?mobile=${m}`);
                const data = await response.json();
                
                if (data.found) {
                    document.getElementById('customerName').value = data.name;
                    updateBalanceUI(data.balance);
                    document.getElementById('foundBadge').classList.remove('hidden');
                } else {
                    alert("Not found. New Customer?");
                    updateBalanceUI(0);
                }
            } catch (e) { alert("Search Error: " + e); }
            finally { document.getElementById('syncLoader').classList.add('hidden'); }
        }

        function updateBalanceUI(bal) {
            let b = parseFloat(bal).toFixed(2);
            document.getElementById('prevBalDisplay').innerText = b;
            document.getElementById('mainPrevBal').innerText = b;
            document.getElementById('balanceAlert').classList.remove('hidden');
            updateTotals();
        }

        // --- 2. CALCULATIONS (FIXED) ---
        function calculatePreview() {
            const cat = document.getElementById('productCategory').value;
            const w = parseFloat(document.getElementById('width').value) || 0;
            const h = parseFloat(document.getElementById('height').value) || 0;
            const qty = parseFloat(document.getElementById('quantity').value) || 1;
            const res = document.getElementById('calcResult');

            if (cat === 'Curtain') {
                // Determine Ratio
                let rVal = document.getElementById('fullness').value;
                let ratio = (rVal === 'custom') ? (parseFloat(document.getElementById('customRatio').value)||0) : parseFloat(rVal);
                
                // Determine Width System
                let fabWidth = parseInt(document.getElementById('fabricWidth').value);
                
                // CALCULATION LOGIC
                let totalMeters = 0;
                let details = "";

                if (fabWidth >= 280) { 
                    // RAILROAD: Width * Fullness
                    totalMeters = (w / 100) * ratio * qty;
                    details = `RR: ${totalMeters.toFixed(2)} Mtr`;
                } else {
                    // PANEL: (Width * Fullness) / FabWidth = Panels
                    let panels = Math.ceil((w * ratio) / 140);
                    if(panels < 1) panels = 1;
                    let cutHeight = (h + 20) / 100; // Height + 20cm hem
                    totalMeters = panels * cutHeight * qty;
                    details = `${panels} Pnls | ${totalMeters.toFixed(2)} Mtr`;
                }
                res.innerText = details;
                return { qty: totalMeters, desc: details }; // Return for usage
            } else {
                let sqm = (w * h) / 10000;
                res.innerText = `${sqm.toFixed(2)} SQM`;
                return { qty: sqm * qty, desc: `${sqm.toFixed(2)} SQM` };
            }
        }

        // --- 3. ADD ITEM ---
        function addItem() {
            const cat = document.getElementById('productCategory').value;
            const type = document.getElementById('productType').value;
            const fab = document.getElementById('fabricName').value;
            const w = parseFloat(document.getElementById('width').value);
            const h = parseFloat(document.getElementById('height').value);
            const q = parseFloat(document.getElementById('quantity').value);
            const price = parseFloat(document.getElementById('pricePerUnit').value) || 0;
            const stitch = parseFloat(document.getElementById('stitchingCharge').value) || 0;
            const fix = parseFloat(document.getElementById('fixingCharge').value) || 0;

            if(!w || !h || !q) return alert("Enter Dimensions");

            // Calculate Item Total
            const calcData = calculatePreview(); 
            // Total = (Material Qty * Price) + (Stitch * Qty) + (Fix * Qty)
            // Note: For Curtains, stitching is usually per piece or per meter width. Assuming per Qty unit here based on input.
            let matCost = calcData.qty * price; 
            let laborCost = (stitch * q) + (fix * q);
            let total = matCost + laborCost;

            // Location
            const loc = `${document.getElementById('floor').value} > ${document.getElementById('roomName').value}`;

            cart.push({
                cat, type, fab, w, h, qty: q, 
                matQty: calcData.qty, 
                desc: calcData.desc,
                price, stitch, fix, total, loc,
                supplier: document.getElementById('itemSupplier').value
            });

            renderCart();
            updateTotals();
            // Optional: Clear basics
            document.getElementById('width').value = '';
            document.getElementById('height').value = '';
        }

        function renderCart() {
            const div = document.getElementById('cartItems');
            document.getElementById('cartCount').innerText = cart.length;
            if(cart.length === 0) { div.innerHTML = "Empty"; return; }
            
            div.innerHTML = cart.map((i, idx) => `
                <div class="bg-white p-2 border-b flex justify-between">
                    <div>
                        <div class="font-bold text-sm">${i.type} (${i.fab})</div>
                        <div class="text-xs text-gray-500">${i.loc} | ${i.w}x${i.h}</div>
                        <div class="text-xs font-bold text-blue-600">${i.desc}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold">${i.total.toFixed(2)}</div>
                        <button onclick="cart.splice(${idx},1);renderCart();updateTotals()" class="text-red-500 text-xs">DEL</button>
                    </div>
                </div>
            `).join('');
        }

        function updateTotals() {
            const bill = cart.reduce((sum, i) => sum + i.total, 0);
            const prev = parseFloat(document.getElementById('mainPrevBal').innerText) || 0;
            const disc = parseFloat(document.getElementById('discountAmount').value) || 0;
            const adv = parseFloat(document.getElementById('advanceAmount').value) || 0;

            document.getElementById('currentBillTotal').innerText = bill.toFixed(2);
            document.getElementById('finalBalance').innerText = ((bill + prev - disc) - adv).toFixed(2);
        }

        // --- 4. RECEIPT & SYNC ---
        function saveReceipt() {
            const amt = parseFloat(document.getElementById('receiptAmount').value);
            if(!amt) return alert("Enter Amount");
            
            const m = document.getElementById('mobileNumber').value;
            const n = document.getElementById('customerName').value;
            const date = document.getElementById('paymentDate').value;
            const mode = document.getElementById('paymentMode').value;

            // Sync
            syncToSheet({
                date: date, ref: "REC", type: "Receipt", name: n, mobile: m,
                debit: 0, credit: amt, balance: 0 // Balance calc handled by sheet or next fetch
            });

            // Update Local UI
            let curAdv = parseFloat(document.getElementById('advanceAmount').value) || 0;
            document.getElementById('advanceAmount').value = curAdv + amt;
            updateTotals();

            document.getElementById('receiptModal').style.display = 'none';
            
            // GENERATE PDF DIRECTLY
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', [200, 100]);
            doc.setFontSize(16); doc.text("PAYMENT RECEIPT", 100, 15, null, "center");
            doc.setFontSize(12);
            doc.text(`Received From: ${n}`, 10, 30);
            doc.text(`Amount: ${amt}`, 10, 40);
            doc.text(`Date: ${date}`, 100, 40);
            doc.text(`Mode: ${mode}`, 10, 50);
            doc.save(`Receipt_${n}.pdf`);
        }

        function saveInvoiceTransaction() {
            if(cart.length === 0) return alert("Cart Empty");
            const m = document.getElementById('mobileNumber').value;
            const n = document.getElementById('customerName').value;
            const bill = parseFloat(document.getElementById('currentBillTotal').innerText);
            const adv = parseFloat(document.getElementById('advanceAmount').value);
            
            // 1. Bill
            syncToSheet({ date: new Date().toLocaleDateString(), ref: globalRefNo, type: "Invoice", name: n, mobile: m, debit: bill, credit: 0, balance: 0 });
            
            // 2. Advance
            if(adv > 0) {
                setTimeout(() => {
                    syncToSheet({ date: new Date().toLocaleDateString(), ref: globalRefNo, type: "Advance", name: n, mobile: m, debit: 0, credit: adv, balance: 0 });
                }, 1000);
            }
            alert("Saved!");
        }

        function syncToSheet(data) {
            document.getElementById('syncLoader').classList.remove('hidden');
            fetch(SHEET_URL, {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
            }).then(() => document.getElementById('syncLoader').classList.add('hidden'));
        }

        // --- UTILS ---
        function toggleFormFields() {
            const c = document.getElementById('productCategory').value;
            const t = document.getElementById('productType');
            const cf = document.getElementById('curtainOptions');
            const st = document.getElementById('stitchingCharge');
            t.innerHTML = '';
            
            if(c === 'Curtain') {
                ['Main', 'Sheer', 'Blackout', 'Linen'].forEach(o => t.add(new Option(o,o)));
                cf.classList.remove('hidden');
                st.classList.remove('hidden');
            } else {
                ['Roller', 'Zebra', 'Sunscreen', 'Venetian'].forEach(o => t.add(new Option(o,o)));
                cf.classList.add('hidden');
                st.classList.add('hidden');
            }
        }
        
        function updateRoomOptions() {
            const b = document.getElementById('buildingType').value;
            const r = document.getElementById('roomName');
            document.getElementById('towerName').classList.toggle('hidden', b !== 'Tower');
            r.innerHTML = '';
            let ops = (b === 'Tower') ? ['Room A', 'Room B', 'Hall'] : ['Living', 'Master Bed', 'Guest'];
            ops.forEach(o => r.add(new Option(o,o)));
        }
        
        function toggleCustomFloor() { document.getElementById('customFloor').classList.toggle('hidden', document.getElementById('floor').value !== 'Other'); }
        function openReceiptModal() { document.getElementById('receiptModal').style.display='flex'; }
        
        // PDF (Invoice/PO)
        function openPreview(type) {
            if(cart.length === 0) return alert("No Items");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18); doc.text("AM SILKS TRADING", 105, 15, null, "center");
            doc.setFontSize(12); doc.text(type.toUpperCase(), 105, 25, null, "center");
            
            const headers = (type === 'invoice') 
                ? ["Loc", "Desc", "Size", "Qty", "Price", "Total"]
                : ["Loc", "Desc", "Size", "Qty", "Fabric Qty"]; // PO/Worksheet
                
            const rows = cart.map(i => {
                let desc = `${i.type} ${i.fab}`;
                let size = `${i.w}x${i.h}`;
                if(type === 'invoice') return [i.loc, desc, size, i.qty, i.price, i.total];
                return [i.loc, desc, size, i.qty, i.matQty.toFixed(2)];
            });

            doc.autoTable({ startY: 35, head: [headers], body: rows });
            doc.save(`${type}.pdf`);
        }
    </script>
</body>
</html>
